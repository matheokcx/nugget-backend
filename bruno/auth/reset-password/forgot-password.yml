info:
  name: forgot-password
  type: http
  seq: 4

http:
  method: POST
  url: "{{base-url}}/auth/forgot-password"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
