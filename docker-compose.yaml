services:
  nest-api:
    build:
      context: .
      target: development
    restart: always
    depends_on:
      postgres-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - base

  postgres-db:
    image: postgres:17
    restart: always
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres -d ${DB_NAME}' ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - base

volumes:
  db:

networks:
  base:
